[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unfoldx-mcp"
version = "0.6.0"
description = "UnfoldX MCP server (stdio) - the unfoldx.v2 public API as MCP tools for agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
urls = { Homepage = "https://unfoldx.ai", Source = "https://github.com/unfoldx-ai/unfoldx", Issues = "https://github.com/unfoldx-ai/unfoldx/issues" }
# Pinned on purpose: the adapter is verified against this SDK and its protocol version.
dependencies = ["mcp==2.3.0", "jsonschema>=4.23,<5", "unfoldx==0.6.0"]

[project.scripts]
unfoldx-mcp = "unfoldx_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
unfoldx = { path = "../cli", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/unfoldx_mcp"]
